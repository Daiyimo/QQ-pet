<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>pet</title>
    <!-- <script src="../service/config.js"></script> -->
    <!-- <script src="./js/init.js"></script> -->
    <style>
        /* //动画 */
        @keyframes loading {

            /*  旋转 */
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .iconActive {
            animation-name: loading;
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        #app,
        #router,
        html,
        body {
            background-color: transparent !important;
        }
        /* Ruffle: 让鼠标事件穿透到下层 #move div */
        ruffle-player {
            pointer-events: none !important;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            warnOnUnsupportedContent: false,
            polyfills: true,
            letterbox: "off",
            wmode: "transparent"
        };
    </script>
    <script src="./js/ruffle/ruffle.js"></script>
    <!-- Ruffle 播放桥：给 swfPet.js 提供帧状态（Ruffle 没有 Flash 的 CurrentFrame/TotalFrames 等 API）。
         必须早于 window.js 注入的 ./util/pet/swfPet.js 执行，故放在 head 里。 -->
    <script src="./util/pet/ruffleBridge.js"></script>
</head>

<body>
    <div id="app" class="drag defaultAppStyle" style="display:none;opacity: 0;transition: 1s;user-select: none;">
        <div id="router">not router</div>
    </div>
</body>

</html>
